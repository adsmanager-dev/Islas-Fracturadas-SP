<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Fuerza Verde — Gobierno de Altis</title>
  <desc>v2. Canon: docs/15 §126 (verde oliva, documentación estatal, marcas antiguas, canales fragmentados). Principio rector: Verde conserva. Símbolo central sustituido: columna/faro como hito territorial y administrativo, no ancla — el ancla naval quedaba leyendo "marina/guardia costera" y Verde es Gobierno, ejército, policía e instituciones. Anillo exterior interrumpido = canales fragmentados; anillo interior íntegro = el Estado sigue existiendo. Original, sin material de terceros.</desc>

  <rect width="128" height="128" fill="#15180F"/>

  <!-- Sello de Estado: anillo exterior INTERRUMPIDO (canales fragmentados) -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#6B7A3A" stroke-width="4"
          stroke-dasharray="58 14 30 12 46 16" stroke-linecap="butt"/>
  <!-- Anillo interior continuo: la institución todavía existe bajo la fractura -->
  <circle cx="64" cy="64" r="43" fill="none" stroke="#8B9A55" stroke-width="2"/>

  <!-- Columna/faro: hito territorial y administrativo del Estado insular -->
  <!-- Sala de luz: cuerpo + remate a dos aguas, no una cúpula ornamental -->
  <rect x="54" y="38" width="20" height="12" fill="#C5CE9E"/>
  <path d="M51 38 L64 27 L77 38 Z" fill="#C5CE9E"/>
  <!-- Destellos contenidos: tres marcas cortas, no un sol -->
  <path d="M64 24 V17 M55 30 L49 24 M73 30 L79 24" stroke="#C5CE9E" stroke-width="3" stroke-linecap="round"/>

  <!-- Fuste -->
  <rect x="60" y="50" width="8" height="38" fill="#C5CE9E"/>
  <!-- Basamento en dos escalones: administración con niveles, no una sola pieza -->
  <rect x="48" y="88" width="32" height="8" fill="#C5CE9E"/>
  <rect x="42" y="96" width="44" height="6" fill="#8B9A55"/>

  <!-- Desgaste: dos cortes que dejan el sello incompleto, no sucio -->
  <path d="M88 92 L104 78" stroke="#15180F" stroke-width="5"/>
  <path d="M24 50 L34 40" stroke="#15180F" stroke-width="4"/>
</svg>
